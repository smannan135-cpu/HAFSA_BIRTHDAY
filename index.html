<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Hafsa ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#000,#2d0036,#000);
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.container{
text-align:center;
z-index:2;
}

h1{
font-size:60px;
color:#ff4da6;
text-shadow:0 0 20px hotpink;
}

p{
margin-top:20px;
font-size:22px;
}

button{
margin-top:40px;
padding:18px 40px;
border:none;
border-radius:50px;
background:#ff4da6;
color:white;
font-size:20px;
cursor:pointer;
}

.heart{
position:absolute;
color:#ff5ca8;
font-size:20px;
animation:float 8s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
opacity:0;
}
100%{
transform:translateY(-120vh);
opacity:1;
}
}
</style>

</head>

<body>

<div class="container">

<h1>Happy Birthday ❤️</h1>

<h2>HAFSA (BICHCHU)</h2>

<p>Every heartbeat has a story...</p>

<button onclick="openWish()">
Open My Heart ❤️
</button>

</div>

<script>

for(let i=0;i<40;i++){

let h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(5+Math.random()*5)+"s";

document.body.appendChild(h);

}

function openWish(){

alert("Surprise loading... ❤️");

}

</script>

</body>
</html>
